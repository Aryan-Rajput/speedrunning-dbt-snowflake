version: 2

models:
  - name: mart_loan_risk
    description: One row per loan, combining risk status, owner details, and actual repayment progress against expected schedule.
    columns:
      - name: loan_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: is_defaulted
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: payment_completion_ratio
        data_tests:
          - not_null

  - name: mart_account_activity
    description: One row per account per month, aggregating transaction volume, credits, withdrawals, and loan repayments.
    columns:
      - name: account_id
        data_tests:
          - not_null
      - name: activity_month
        data_tests:
          - not_null
      - name: transaction_count
        data_tests:
          - not_null