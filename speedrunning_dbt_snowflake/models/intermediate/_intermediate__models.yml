version: 2

models:
  - name: int_account_owners
    description: One row per account, joined to its owning client and their demographic details.
    columns:
      - name: disp_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests: [not_null]
      - name: client_id
        data_tests: [not_null]

  - name: int_loan_risk_flags
    description: One row per loan, with A/B/C/D status translated into is_defaulted/is_active flags.
    columns:
      - name: loan_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests: [not_null]

  - name: int_transaction_categorized
    description: One row per transaction, passed through from staging with a loan-repayment flag added to prevent double-counting against the loan table.
    columns:
      - name: trans_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests: [not_null]