version: 2

sources:
  - name: raw
    database: speedrun_db
    schema: raw
    tables: 
      - name: account
      - name: card
      - name: client
      - name: disp
      - name: district
      - name: loan
      - name: orders
      - name: trans

models:

#=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-++++++++=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

  - name: stg_account
    description: One row per account, cleaned and cast from raw account data.
    columns:
      - name: account_id
        description: Primary key, unique identifier for each account.
        data_tests:
          - unique
          - not_null

      - name: district_id
        description: Foreign key to district, location of the account's branch.
        data_tests:
          - not_null

      - name: account_created_date
        description: Date the account was created.
        data_tests:
          - not_null

      - name: frequency
        description: Frequency of statement issuance for the account.
        data_tests:
          - not_null

#=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-++++++++=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

  - name: stg_client
    description: One row per client, with birth_number decoded into birth_date and sex.
    columns:
      - name: client_id
        description: Primary key, unique identifier for each client.
        data_tests:
          - unique
          - not_null

      - name: district_id
        description: Foreign key to district, client's registered address.
        data_tests:
          - not_null

      - name: client_gender
        description: Client's sex, derived from the birth_number encoding (M or F).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['M', 'F']

      - name: birth_date
        description: Client's date of birth, decoded from the raw birth_number field.
        data_tests:
          - not_null


#=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-++++++++=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

  - name: stg_disp
    description: One row per disposition, linking a client to an account with a role (owner or disponent).
    columns:
      - name: disp_id
        description: Primary key, unique identifier for each disposition record.
        data_tests:
          - unique
          - not_null

      - name: client_id
        description: Foreign key to client.
        data_tests:
          - not_null

      - name: account_id
        description: Foreign key to account.
        data_tests:
          - not_null

      - name: type
        description: Role this client has on the account — OWNER or DISPONENT. Only owners can request loans or issue permanent orders.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OWNER', 'DISPONENT']


#=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-++++++++=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

  - name: stg_district
    description: One row per district, with the district name and region.
    columns:
      # column1 eg value -- 1
      - name: district_id
        description: Primary key, unique identifier for each district.
        data_tests:
          - unique
          - not_null
      # column2 eg value -- "Hl.m. Praha"
      - name: district_name
        description: Name of the district.
        data_tests:
          - not_null
      # column3 eg value -- "Prague"
      - name: region
        description: Region the district belongs to.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: 
                  - east Bohemia
                  - north Moravia
                  - south Bohemia
                  - north Bohemia
                  - west Bohemia
                  - south Moravia
                  - Prague
                  - central Bohemia
      # column4 eg value -- 1204953
      - name: no_of_inhabitants
        description: Number of inhabitants in the district.
        data_tests:
          - not_null
      # column5 eg value -- 0
      - name: no_of_municipalities_lt499
        description: Number of municipalities with less than 499 inhabitants.
        data_tests:
          - not_null
      # column6 eg value -- 0
      - name: no_of_municipalities_500_1999
        description: Number of municipalities with 500 to 1999 inhabitants.
        data_tests:
          - not_null
      # column7 eg value -- 0
      - name: no_of_municipalities_2000_9999
        description: Number of municipalities with 2000 to 9999 inhabitants.
        data_tests:
          - not_null
      # column8 eg value -- 1
      - name: no_of_municipalities_gt10000
        description: Number of municipalities with more than 10,000 inhabitants.
        data_tests:
          - not_null
      # column9 eg value -- 1
      - name: no_of_cities
        description: Number of cities in the district.
        data_tests:
          - not_null
      # column10 eg value -- 100.0
      - name: ratio_urban_inhabitants
        description: Ratio of urban inhabitants in the district.
        data_tests:
          - not_null
      # column11 eg value -- 12541
      - name: average_salary
        description: Average salary in the district.
        data_tests:
          - not_null
      # column12 eg value -- 0.29
      - name: unemployment_rate_95
        description: Unemployment rate in 1995. Removed Not NULL test because there exists values as '?' in the raw data.
      # column13 eg value -- 0.43
      - name: unemployment_rate_96
        description: Unemployment rate in 1996.
        data_tests:
          - not_null
      # column14 eg value -- 167
      - name: entrepreneurs_per_1000_inhabitants
        description: Number of entrepreneurs per 1000 inhabitants.
        data_tests:
          - not_null
      # column15 eg value -- 85677
      - name: no_of_crimes_95
        description: Number of crimes in 1995. Removed Not NULL test because there exists values as '?' in the raw data.
      # column16 eg value -- 99107
      - name: no_of_crimes_96
        description: Number of crimes in 1996.
        data_tests:
          - not_null


#=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-++++++++=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=


  - name: stg_card
    description: One row per card, linked to a disposition.
    columns:
      - name: card_id
        data_tests:
          - unique
          - not_null
      - name: disp_id
        data_tests:
          - not_null
      - name: card_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['junior', 'classic', 'gold']   # verify exact values yourself first
      - name: card_issued_date
        data_tests:
          - not_null


#=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-++++++++=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=


  - name: stg_loan
    description: One row per loan, with amount, duration, and raw status code.
    columns:
      - name: loan_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: loan_date
        data_tests:
          - not_null
      - name: loan_amount
        data_tests:
          - not_null
      - name: loan_duration_months
        data_tests:
          - not_null
      - name: monthly_payment
        data_tests:
          - not_null
      - name: loan_status_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D']


#=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-++++++++=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=


  - name: stg_orders
    description: One row per standing order, with purpose decoded from k_symbol.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: order_amount
        data_tests:
          - not_null
      - name: order_purpose
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['insurance_payment', 'household_payment', 'leasing_payment', 'loan_payment', 'unspecified']


#=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-++++++++=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=


  - name: stg_trans
    description: One row per transaction, with type, operation, and purpose decoded from raw Czech codes.
    columns:
      - name: trans_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: trans_date
        data_tests:
          - not_null
      - name: trans_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit', 'withdrawal']
      - name: trans_amount
        data_tests:
          - not_null
      - name: balance_after_trans
        data_tests:
          - not_null
